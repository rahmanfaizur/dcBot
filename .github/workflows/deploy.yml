name: Deploy to Azure VM

# Secrets (set in GitHub → Settings → Secrets and variables → Actions):
#   AZURE_VM_HOST      — VM public IP or hostname (not stored in this repo)
#   AZURE_VM_USER      — SSH user, e.g. azureuser
#   AZURE_VM_SSH_KEY   — private key contents (PEM file), never commit the key file

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure-vm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Only deploy from the canonical repo; forks must not run SSH deploy.
    if: github.repository == 'rahmanfaizur/dcBot'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/dcBot
            bash deploy/vm-deploy.sh
