services:
  # Host network is required so Linkdave can send Discord voice UDP.
  #
  # WARP (optional): use the "warp" profile — Docker sidecar only, never warp-cli on the host.
  #   docker compose --profile docker --profile warp up -d
  #   YTDLP_PROXY=socks5://127.0.0.1:1080   (in .env)
  # Full-tunnel warp-cli on the VM host breaks inbound SSH. This sidecar does not.
  linkdave:
    image: ghcr.io/shi-gg/linkdave:latest
    restart: unless-stopped
    network_mode: host
    environment:
      LINKDAVE_PASSWORD: ${LINKDAVE_PASSWORD:?LINKDAVE_PASSWORD required in .env}
      LINKDAVE_PORT: "8080"
      LINKDAVE_SOURCE_HTTPS_ENABLED: "true"
      LINKDAVE_SOURCE_HTTP_ENABLED: "true"
      LINKDAVE_SOURCE_IP_ADDRESS_PUBLIC_ENABLED: "true"
      LINKDAVE_SOURCE_IP_ADDRESS_PRIVATE_ENABLED: "true"
    # Linkdave is a distroless image — no wget/curl/shell. Use its built-in binary.
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Cloudflare WARP as a local SOCKS proxy (opt-in via --profile warp).
  # Traffic stays inside this container; the host default route is unchanged.
  # Port is bound to 127.0.0.1 only so nothing off-box can use the proxy.
  warp:
    profiles: ["warp"]
    image: caomingjun/warp
    container_name: mybot-warp
    restart: unless-stopped
    ports:
      - "127.0.0.1:1080:1080"
    environment:
      WARP_SLEEP: "2"
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp-data:/var/lib/cloudflare-warp

  # Optional: run the bot in Docker too (local dev usually uses `make dev` instead).
  bot:
    profiles: ["docker"]
    build: .
    restart: unless-stopped
    env_file: .env
    network_mode: host
    environment:
      LINKDAVE_URL: ws://127.0.0.1:8080
      # Override host dev paths from .env (e.g. /snap/bin/yt-dlp does not exist in Alpine).
      YTDLP_PATH: yt-dlp
      FFMPEG_PATH: ffmpeg
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
      # Opt-in only. On datacenter IPs a signed-in session makes YouTube withhold
      # every audio format, so cookies must never be forced on here. Set
      # YTDLP_COOKIES_FILE in .env when running from a home connection.
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      linkdave:
        condition: service_healthy

  # Public FR Music site — https://music.frlabs.me
  # DNS: A record music.frlabs.me → VM public IP (Static recommended)
  # Azure NSG must allow inbound 80 and 443.
  #   docker compose --profile web up -d
  web:
    profiles: ["web"]
    image: caddy:2-alpine
    container_name: frmusic-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  warp-data:
  caddy-data:
  caddy-config:
